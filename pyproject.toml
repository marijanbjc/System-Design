[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ticket-bot"
version = "0.1.0"
description = "PoC автоматизации обработки тикетов поддержки: классификация, маршрутизация, RAG-черновики"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "Maryan Byelich" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=6.0",
    "redisvl>=0.25",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools]
packages = [
    "app",
    "app.api",
    "app.llm",
    "app.ml",
    "app.preprocessing",
    "app.queues",
    "app.routing",
    "app.storage",
    "app.workers",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
