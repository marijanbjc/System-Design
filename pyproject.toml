[tool.poetry]
name = "system-design"
version = "0.1.0"
description = "PoC для автоматизации обработки тикетов поддержки"
authors = ["Maryan.Byelich <Maryan.Byelich@x5.ru>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
redis = "^6.0"
pydantic = "^2.9"
pydantic-settings = "^2.6"
redisvl = "^0.25.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
httpx = "^0.27"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
